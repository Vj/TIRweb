  - module_id: "TIR-INFRA"
    name: "Infrastructure, DevSecOps, Supply Chain & Telemetry Engine"
    checks:
      - id: "WEB-INF-001"
        title: "Web Server Hardening, Security Headers, CORS Policy & HTTP Method Restrictions"
