schema_version: "1.0.0"
tool_suite: "TIRweb"
metadata:
  description: "TIRweb Comprehensive Web Application, API, DevSecOps & Cloud-Native Security Audit Checklist with OWASP WSTG v4.2, Indian & Global Regulatory Mappings"
  supported_profiles:
    - "core"
    - "bfsi_fintech"
    - "saas_multitenant"
    - "healthcare_pii"
    - "ecommerce"

modules:
  # ============================================================================
  # MODULE 1: IDENTITY, ACCESS CONTROL & SESSION ENGINE (11 Checks: WEB-IAM-001..011)
  # ============================================================================
  - module_id: "TIR-IAM"
    name: "Identity, Access Control & Session Engine"
    checks:
      - id: "WEB-IAM-001"
        title: "Horizontal Privilege Escalation (IDOR / BOLA), Identifier Entropy & File Path Traversal"
        category: "Broken Access Control / API Security"
        severity: "Critical"
        execution_mode: "hybrid"
        tool_binding: ["httpx_idor_diff", "nuclei_bola", "manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Verify that substituting resource IDs in URLs, query parameters, or JSON bodies across User A and User B tokens does not expose unauthorized records."
          - "Confirm sequential ID enumeration is blocked across all endpoints returning user-specific data."
          - "Validate that UUIDs/GUIDs are cryptographically random (v4) rather than sequential or time-based (v1)."
          - "Verify file download endpoints enforce canonical path validation and prevent traversal to other users' files."
        compliance:
          india:
            - "DPDP Rules 2025 - Rule 6(1)(b) (Access Control Safeguards)"
            - "CERT-In CISG-2024-01 (Secure Access Control)"
            - "RBI Digital Payment Security Controls (Customer Data Isolation)"
          global:
            - "OWASP Top 10: A01 Broken Access Control"
            - "OWASP API Top 10: API1 BOLA"
            - "OWASP WSTG v4.2: WSTG-ATHZ-01, WSTG-ATHZ-04"
            - "PCI DSS v4.0: Req. 6.2.4, 7.2"
            - "ISO 27001:2022: A.8.3, A.8.26"
            - "SOC 2: CC6.1, CC6.3"

      - id: "WEB-IAM-002"
        title: "Vertical Privilege Escalation, BFLA, HTTP Method Tampering & Forced Admin Browsing"
        category: "Broken Access Control / API Security"
        severity: "Critical"
        execution_mode: "hybrid"
        tool_binding: ["nuclei_bfla", "manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Verify standard users cannot access administrative pages, API endpoints, or feature-flagged functionality by modifying URLs or client-side flags."
          - "Confirm role-based UI hiding is backed by strict server-side authorization enforcement."
          - "Verify HTTP method overrides (GET, POST, PUT, PATCH, DELETE, HEAD) enforce identical authorization rules."
          - "Confirm access controls are immediately re-evaluated after privilege revocation, role change, or subscription downgrade."
        compliance:
          india:
            - "DPDP Rules 2025 - Rule 6(1)(b) (Role-Based Access Enforcement)"
            - "CERT-In CISG-2024-01"
          global:
            - "OWASP Top 10: A01 Broken Access Control"
            - "OWASP API Top 10: API5 BFLA"
            - "OWASP WSTG v4.2: WSTG-ATHZ-02, WSTG-ATHZ-03"
            - "PCI DSS v4.0: Req. 6.2.4, 7.2.2"
            - "ISO 27001:2022: A.8.2, A.8.3"
            - "SOC 2: CC6.2, CC6.3"

      - id: "WEB-IAM-003"
        title: "Multi-Tenant Isolation & Cross-Tenant Data Enumeration"
        category: "Multi-Tenancy Security"
        severity: "Critical"
        execution_mode: "manual"
        tool_binding: ["httpx_idor_diff", "manual_proxy"]
        profiles: ["saas_multitenant", "healthcare_pii", "bfsi_fintech"]
        test_procedures:
          - "Verify Tenant A cannot access Tenant B data through any REST, GraphQL, or background export endpoint."
          - "Confirm cross-tenant resource enumeration and shared-cache or search-index leakage are prevented."
          - "Verify tenant context is derived strictly from verified server-side session/token claims rather than untrusted headers."
        compliance:
          india:
            - "DPDP Rules 2025 - Rule 6(1)(b) & (c) (Data Segregation)"
            - "RBI Master Direction on Outsourcing / Cloud Isolation"
          global:
            - "OWASP Top 10: A01 Broken Access Control"
            - "ISO 27001:2022: A.8.3, A.8.26"
            - "SOC 2: CC6.1"

      - id: "WEB-IAM-004"
        title: "Authentication Hardening (Brute-Force, Password Policy, Breach Screening & Enumeration)"
        category: "Identification and Authentication Failures"
        severity: "High"
        execution_mode: "hybrid"
        tool_binding: ["nuclei_auth", "manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Verify brute-force protections (progressive delay, CAPTCHA, or account lockout) are enforced on login endpoints."
          - "Confirm password policies enforce a 12+ character minimum and screen against known compromised password lists."
          - "Verify login, registration, and password reset return uniform responses and constant-time execution to prevent user enumeration."
        compliance:
          india:
            - "CERT-In CISG-2024-01 (Authentication Controls)"
            - "RBI Digital Payment Security Controls (Credential Hygiene)"
          global:
            - "OWASP Top 10: A07 Identification and Authentication Failures"
            - "OWASP WSTG v4.2: WSTG-IDNT-04, WSTG-ATHN-03, WSTG-ATHN-07"
            - "PCI DSS v4.0: Req. 8.3.4, 8.3.6"
            - "ISO 27001:2022: A.8.5"
            - "SOC 2: CC6.1"

      - id: "WEB-IAM-005"
        title: "MFA Enforcement & Enterprise SSO Integrity (OAuth 2.0 / OIDC / SAML)"
        category: "Identity & Single Sign-On Flaws"
        severity: "Critical"
        execution_mode: "hybrid"
        tool_binding: ["nuclei_auth", "manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Verify Multi-Factor Authentication cannot be bypassed via direct post-authentication navigation, backup code brute-forcing, or pre-MFA session reuse."
          - "Validate OAuth 2.0 / OIDC flows enforce exact redirect_uri matching, cryptographic state parameters (CSRF protection), and strict token audience (aud) validation."
          - "Verify SAML assertions reject XML Signature Wrapping (XSW), unsigned assertions, and replayed assertion IDs."
        compliance:
          india:
            - "RBI Digital Payment Security Controls (Mandatory 2FA / Additional Factor of Authentication)"
            - "CERT-In CISG-2024-01"
          global:
            - "OWASP Top 10: A07 Identification and Authentication Failures"
            - "OWASP WSTG v4.2: WSTG-ATHN-04, WSTG-ATHN-11"
            - "PCI DSS v4.0: Req. 8.4"
            - "ISO 27001:2022: A.8.5"
            - "SOC 2: CC6.1"

      - id: "WEB-IAM-006"
        title: "Session Lifecycle Management, Token Entropy & Fixation Resistance"
        category: "Session Management"
        severity: "High"
        execution_mode: "hybrid"
        tool_binding: ["httpx_jwt", "httpx_headers", "manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Confirm session identifiers and JWTs use strong cryptographic algorithms/entropy and are regenerated immediately upon authentication (preventing session fixation)."
          - "Verify logout invalidates the session token server-side rather than merely clearing client cookies."
          - "Verify inactivity timeouts, token expiration ('exp'), concurrent session policies, and Secure/HttpOnly/SameSite cookie attributes are enforced."
        compliance:
          india:
            - "CERT-In CISG-2024-01 (Session Management)"
            - "RBI Digital Payment Security Controls (Session Timeout & Binding)"
          global:
            - "OWASP Top 10: A07 Identification and Authentication Failures"
            - "OWASP WSTG v4.2: WSTG-SESS-01, WSTG-SESS-02, WSTG-SESS-03, WSTG-SESS-06, WSTG-SESS-07, WSTG-SESS-10"
            - "PCI DSS v4.0: Req. 8.2.8"
            - "ISO 27001:2022: A.8.5"
            - "SOC 2: CC6.1"

      - id: "WEB-IAM-007"
        title: "Account Lifecycle, Password Reset Security & DPDP Right to Erasure"
        category: "Account and User Management"
        severity: "High"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Verify password reset tokens are single-use, short-lived, resistant to token manipulation, and do not leak account existence."
          - "Confirm authenticated password and email updates require current credential/out-of-band verification to prevent account takeover."
          - "Verify account registration enforces email verification, prevents alias abuse, and prevents role escalation via user invitations."
          - "Confirm account deletion executes verifiable hard erasure of personal data rather than leaving records accessible via API."
        compliance:
          india:
            - "DPDP Act 2023 Sec 12 & DPDP Rules 2025 (Right to Erasure & Correction)"
            - "CERT-In CISG-2024-01"
          global:
            - "OWASP Top 10: A07 Identification and Authentication Failures"
            - "OWASP WSTG v4.2: WSTG-IDNT-02, WSTG-IDNT-03, WSTG-ATHN-09"
            - "ISO 27001:2022: A.8.10"
            - "SOC 2: P4.2, P5.1"

      - id: "WEB-IAM-008"
        title: "Advanced API & Microservice Authorization (Mass Assignment, GraphQL, Versioning & gRPC)"
        category: "API-Specific & Microservices Security"
        severity: "High"
        execution_mode: "hybrid"
        tool_binding: ["httpx_graphql", "nuclei_bola", "nuclei_bfla", "manual_proxy"]        
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Verify JSON/form endpoints reject unexpected privileged fields (mass assignment / auto-binding) and avoid excessive data exposure beyond UI requirements."
          - "Verify API keys/OAuth tokens enforce granular scope limits and per-endpoint rate limiting."
          - "Confirm deprecated API versions (e.g., /api/v1/) with weaker controls are decommissioned."
          - "For GraphQL/gRPC: verify introspection is disabled in production, query depth/batching limits are enforced, and internal microservice calls validate caller identity."
        compliance:
          india:
            - "CERT-In CISG-2024-01 (API Security)"
            - "RBI Digital Payment Security Controls (API Gateway & Microservice Security)"
          global:
            - "OWASP API Top 10: API3 BOPLA, API4 Unrestricted Resource Consumption, API9 Improper Inventory"
            - "OWASP WSTG v4.2: WSTG-APIT-01"
            - "PCI DSS v4.0: Req. 6.2.4"
            - "ISO 27001:2022: A.8.26"
            - "SOC 2: CC6.1"

      - id: "WEB-IAM-009"
        title: "[WSTG-ATHN-05 / ATHN-08] Remember-Me Token Security & Security Question Hygiene"
        category: "Authentication Testing"
        severity: "Medium"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Verify 'Remember Me' functionality issues high-entropy, revocable, expiring tokens rather than storing plaintext or reversible credentials in cookies/localStorage."
          - "Verify account recovery avoids OSINT-guessable security questions in favor of cryptographic MFA or out-of-band verification."
        compliance:
          india:
            - "CERT-In CISG-2024-01 (Credential & Token Hygiene)"
            - "DPDP Rules 2025 - Rule 6(1)(a) & (b)"
          global:
            - "OWASP WSTG v4.2: WSTG-ATHN-05, WSTG-ATHN-08"
            - "OWASP Top 10: A07 Identification and Authentication Failures"
            - "PCI DSS v4.0: Req. 8.3"
            - "ISO 27001:2022: A.8.5"

      - id: "WEB-IAM-010"
        title: "[WSTG-ATHN-10] Alternative Channel Authentication Parity (Mobile, Legacy & Partner APIs)"
        category: "Authentication Testing"
        severity: "High"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Identify all alternative entry channels (mobile app APIs, B2B partner gateways, legacy web endpoints) and verify they enforce equivalent MFA, lockout, and password complexity controls as the primary web application."
        compliance:
          india:
            - "RBI Digital Payment Security Controls (Multi-Channel Authentication Parity)"
            - "CERT-In CISG-2024-01"
          global:
            - "OWASP WSTG v4.2: WSTG-ATHN-10"
            - "OWASP Top 10: A07 Identification and Authentication Failures"
            - "ISO 27001:2022: A.8.5, A.8.26"

      - id: "WEB-IAM-011"
        title: "[WSTG-SESS-08] Session Puzzling & Cross-Module Session Variable Isolation"
        category: "Session Management"
        severity: "Medium"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Map session state variables across multi-step flows (registration, password reset, partial MFA login) and verify variables populated in one flow cannot be reused to bypass authentication or authorization in another module."
        compliance:
          india:
            - "CERT-In CISG-2024-01 (Session State Integrity)"
          global:
            - "OWASP WSTG v4.2: WSTG-SESS-08"
            - "OWASP Top 10: A07 Identification and Authentication Failures"
            - "ISO 27001:2022: A.8.5"

  # ============================================================================
  # MODULE 2: CRYPTOGRAPHY, TRANSPORT & DATA PROTECTION ENGINE (4 Checks: WEB-CRY-001..004)
  # ============================================================================
  - module_id: "TIR-CRYPTO"
    name: "Cryptography, Transport & Data Protection Engine"
    checks:
      - id: "WEB-CRY-001"
        title: "Transport Layer Hardening (HTTPS Enforcement, TLS 1.2/1.3, Cipher Suites & HSTS)"
        category: "Cryptographic Failures"
        severity: "High"
        execution_mode: "automated"
        tool_binding: ["testssl", "httpx_headers"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Verify all endpoints enforce HTTPS with no unencrypted HTTP fallback."
          - "Confirm TLS 1.3 is preferred, TLS 1.2 is the minimum supported version, and weak ciphers (RC4, DES, 3DES, export ciphers) are disabled."
          - "Verify Strict-Transport-Security (HSTS) header is present with an adequate max-age (>= 31536000)."
        compliance:
          india:
            - "DPDP Rules 2025 - Rule 6(1)(a) (Encryption in Transit)"
            - "CERT-In CISG-2024-01"
            - "RBI Digital Payment Security Controls"
          global:
            - "OWASP Top 10: A02 Cryptographic Failures"
            - "OWASP WSTG v4.2: WSTG-CONF-07, WSTG-CRYP-01, WSTG-CRYP-03"
            - "PCI DSS v4.0: Req. 4.2.1"
            - "ISO 27001:2022: A.8.24"
            - "SOC 2: CC6.7"

      - id: "WEB-CRY-002"
        title: "Encryption at Rest, Modern Password Hashing & Cryptographic Key Management"
        category: "Cryptographic Failures"
        severity: "Critical"
        execution_mode: "hybrid"
        tool_binding: ["trivy_sca", "manual_review"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Verify sensitive databases, file storage, and backups are encrypted at rest."
          - "Confirm passwords are hashed using Argon2id, bcrypt, or scrypt with strong work factors (reject MD5, SHA-1, or unsalted hashes)."
          - "Verify cryptographic keys are not hardcoded in source code or config files and follow documented key rotation and KMS separation."
        compliance:
          india:
            - "DPDP Rules 2025 - Rule 6(1)(a) (Encryption, Obfuscation, Masking, Virtual Tokens)"
            - "CERT-In CISG-2024-02 (CBOM Cryptographic Inventory)"
            - "RBI Card Data Tokenisation Guidelines"
          global:
            - "OWASP Top 10: A02 Cryptographic Failures"
            - "OWASP WSTG v4.2: WSTG-CRYP-04"
            - "PCI DSS v4.0: Req. 3.5, 3.6, 3.7"
            - "ISO 27001:2022: A.8.24"
            - "SOC 2: CC6.1"

      - id: "WEB-CRY-003"
        title: "Sensitive Data Exposure Prevention (URLs, Client Storage, Cache Headers & Logs)"
        category: "Cryptographic Failures / Data Privacy"
        severity: "High"
        execution_mode: "hybrid"
        tool_binding: ["httpx_jwt", "httpx_headers", "manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Verify session tokens, API keys, passwords, and PII are never transmitted in URL query parameters or exposed in unencrypted JWS payloads."
          - "Confirm sensitive tokens and PII are not persisted in browser localStorage, sessionStorage, or unencrypted cookies."
          - "Verify sensitive responses return Cache-Control: no-store and that PANs, credentials, and PII are scrubbed from web/application logs."
        compliance:
          india:
            - "DPDP Rules 2025 - Rule 6(1)(a) & (c) (PII Masking & Exposure Prevention)"
            - "RBI Digital Payment Security Controls"
          global:
            - "OWASP Top 10: A02 Cryptographic Failures"
            - "OWASP WSTG v4.2: WSTG-ATHN-06, WSTG-SESS-04, WSTG-CLNT-12"
            - "PCI DSS v4.0: Req. 3.3, 3.4"
            - "ISO 27001:2022: A.8.11"
            - "SOC 2: CC6.1, P3.2"

      - id: "WEB-CRY-004"
        title: "[WSTG-CRYP-02] Padding Oracle Resistance on Encrypted Cookies & Tokens"
        category: "Cryptography"
        severity: "High"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Identify CBC-mode encrypted cookies, viewstates, or opaque tokens and verify ciphertext tampering returns uniform errors without padding oracle side-channels (prefer AEAD modes such as AES-GCM or ChaCha20-Poly1305)."
        compliance:
          india:
            - "DPDP Rules 2025 - Rule 6(1)(a) (Cryptographic Safeguards)"
            - "CERT-In CISG-2024-02 (CBOM Cryptographic Governance)"
          global:
            - "OWASP WSTG v4.2: WSTG-CRYP-02"
            - "OWASP Top 10: A02 Cryptographic Failures"
            - "PCI DSS v4.0: Req. 3.5, 4.2.1"
            - "ISO 27001:2022: A.8.24"

  # ============================================================================
  # MODULE 3: INJECTION, PROTOCOL & CLIENT-SIDE PARSER ENGINE (9 Checks: WEB-INJ-001..009)
  # ============================================================================
  - module_id: "TIR-INJECT"
    name: "Injection, Protocol & Client-Side Parser Engine"
    checks:
      - id: "WEB-INJ-001"
        title: "SQL & NoSQL Injection (Parameterized Queries, Blind & Second-Order SQLi)"
        category: "Injection"
        severity: "Critical"
        execution_mode: "hybrid"
        tool_binding: ["nuclei_injection", "manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Verify all database queries use parameterized statements or prepared queries rather than string concatenation."
          - "Test all input vectors for error-based, boolean-blind, time-blind, and second-order SQL/NoSQL injection."
          - "Confirm database error messages do not leak schema, table names, or SQL syntax details."
        compliance:
          india:
            - "CERT-In CISG-2024-01 (Input Validation & Secure Coding)"
            - "CERT-In CISG-2026-02 (Defending against AI-Assisted Exploitation)"
          global:
            - "OWASP Top 10: A03 Injection"
            - "OWASP WSTG v4.2: WSTG-INPV-04"
            - "PCI DSS v4.0: Req. 6.2.4 (formerly 6.5.1)"
            - "ISO 27001:2022: A.8.25, A.8.28"
            - "SOC 2: CC7.1"

      - id: "WEB-INJ-002"
        title: "Cross-Site Scripting (Reflected, Stored, DOM, File-Upload XSS & Context Encoding)"
        category: "Injection"
        severity: "High"
        execution_mode: "hybrid"
        tool_binding: ["nuclei_injection", "httpx_headers", "manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Test all parameters, paths, user-generated content fields, and client-side DOM sinks for reflected, stored, and DOM-based XSS."
          - "Verify context-aware output encoding is applied across HTML, JavaScript, URL, and CSS contexts."
          - "Verify SVG and HTML file uploads sanitize or strip embedded scripts, and confirm CSP and HttpOnly session cookies are enforced."
        compliance:
          india:
            - "CERT-In CISG-2024-01 (Client-Side Injection Controls)"
          global:
            - "OWASP Top 10: A03 Injection"
            - "OWASP WSTG v4.2: WSTG-INPV-01, WSTG-INPV-02, WSTG-CLNT-01, WSTG-CLNT-02, WSTG-CLNT-03"
            - "PCI DSS v4.0: Req. 6.2.4 (formerly 6.5.7)"
            - "ISO 27001:2022: A.8.26, A.8.28"
            - "SOC 2: CC7.1"

      - id: "WEB-INJ-003"
        title: "OS Command, LDAP, SSTI, CRLF & Email Header Injection"
        category: "Injection"
        severity: "Critical"
        execution_mode: "hybrid"
        tool_binding: ["nuclei_injection", "manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Test system-interacting parameters for OS command injection and directory lookups for LDAP injection."
          - "Test template-rendered user inputs for Server-Side Template Injection (SSTI)."
          - "Test HTTP response headers for CRLF injection and contact/notification forms for email header injection."
        compliance:
          india:
            - "CERT-In CISG-2024-01"
            - "CERT-In CISG-2026-02"
          global:
            - "OWASP Top 10: A03 Injection"
            - "OWASP WSTG v4.2: WSTG-INPV-05, WSTG-INPV-09, WSTG-INPV-10, WSTG-INPV-11"
            - "PCI DSS v4.0: Req. 6.2.4"
            - "ISO 27001:2022: A.8.28"
            - "SOC 2: CC7.1"

      - id: "WEB-INJ-004"
        title: "XML External Entity (XXE) & Insecure Deserialization"
        category: "Injection / Software & Data Integrity"
        severity: "Critical"
        execution_mode: "hybrid"
        tool_binding: ["nuclei_injection", "manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Verify external entity resolution (DTD) and XInclude processing are disabled in all XML/SOAP/document parsers."
          - "Verify serialized objects (Java, .NET, PHP, Python) passed in cookies or API payloads are rejected or cryptographically signed."
        compliance:
          india:
            - "CERT-In CISG-2024-01"
          global:
            - "OWASP Top 10: A05 Security Misconfiguration / A08 Integrity Failures"
            - "OWASP WSTG v4.2: WSTG-INPV-06, WSTG-INPV-14"
            - "PCI DSS v4.0: Req. 6.2.4"
            - "ISO 27001:2022: A.8.28"
            - "SOC 2: CC7.1"

      - id: "WEB-INJ-005"
        title: "Modern Protocol & Browser Parser Attacks (Smuggling, Prototype Pollution, WebSockets, postMessage & Cache Poisoning)"
        category: "Advanced Protocol & Client-Side Security"
        severity: "High"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "ecommerce"]
        test_procedures:
          - "Test reverse-proxy and backend boundaries for HTTP Request Smuggling (CL.TE / TE.CL) desynchronization."
          - "Verify JavaScript/Node.js JSON and query parsers block Prototype Pollution (__proto__, constructor.prototype)."
          - "Verify WebSocket/SSE connections enforce wss:// encryption, strict Origin checks (preventing CSWSH), and message-level authorization."
          - "Audit window.postMessage handlers for strict event.origin validation and test unkeyed headers (X-Forwarded-Host) against Web Cache Poisoning and Cache Deception."
        compliance:
          india:
            - "CERT-In CISG-2026-02 (Protocol & Browser Exposure Hardening)"
            - "CERT-In CISG-2024-01"
          global:
            - "OWASP Top 10: A04 Insecure Design / A05 Security Misconfiguration"
            - "OWASP WSTG v4.2: WSTG-INPV-15, WSTG-INPV-16, WSTG-CLNT-10, WSTG-CLNT-11"
            - "ISO 27001:2022: A.8.26, A.8.27"
            - "SOC 2: CC7.1"

      - id: "WEB-INJ-006"
