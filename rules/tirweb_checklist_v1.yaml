        test_procedures:
          - "Verify CSP, X-Frame-Options (or frame-ancestors), X-Content-Type-Options: nosniff, Referrer-Policy, and Permissions-Policy headers are present."
          - "Verify CORS policies restrict Access-Control-Allow-Origin to trusted domains rather than wildcards or arbitrary reflected origins."
          - "Confirm default credentials are removed, directory listing is disabled, unnecessary HTTP methods (TRACE, excessive OPTIONS) are blocked, and Server/X-Powered-By headers are obfuscated."
