            - "ISO 27001:2022: A.8.5"
            - "SOC 2: CC6.1"

      - id: "WEB-IAM-016"
        title: "[WSTG-ATHN-10] Test Weaker Authentication in Alternative Channel"
        category: "Authentication Testing"
        severity: "High"
