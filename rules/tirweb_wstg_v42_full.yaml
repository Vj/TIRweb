      - id: "WEB-IAM-017"
        title: "[WSTG-ATHN-11] Testing Multi-Factor Authentication (MFA)"
        category: "Authentication Testing"
        severity: "Critical"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Objective: Verify MFA implementation cannot be bypassed."
          - "Test MFA code brute-force/rate limiting."
          - "Test replay of used OTP."
          - "Test bypass by direct navigation to post-auth pages."
          - "Test backup-code weaknesses."
          - "Expected Secure Result: MFA cannot be bypassed, brute-forced, or replayed; enforced on all sensitive actions."
          - "Reference Commands: Burp Intruder on OTP field (rate-limit test) | curl https://target.com/dashboard (skip MFA step)"
        compliance:
