      - id: "WEB-IAM-018"
        title: "[WSTG-ATHZ-01] Test Directory Traversal / File Include"
        category: "Authorization Testing"
        severity: "Critical"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Objective: Test for path traversal/LFI/RFI vulnerabilities."
          - "Identify parameters handling file paths."
          - "Inject traversal payloads."
          - "Test null byte/encoding bypasses."
