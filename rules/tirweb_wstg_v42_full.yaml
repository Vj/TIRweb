            - "PCI DSS v4.0: Req. 8.3, 8.4"
            - "ISO 27001:2022: A.8.5"
            - "SOC 2: CC6.1"

      - id: "WEB-IAM-015"
        title: "[WSTG-ATHN-09] Test Weak Password Change/Reset Functionalities"
        category: "Authentication Testing"
        severity: "Critical"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Objective: Verify password reset process cannot be abused (token reuse, host header injection, no old-password check)."
          - "Request password reset and inspect token (randomness/expiry)."
          - "Test token reuse after use."
          - "Test Host Header Injection in reset link."
          - "Verify old-password required for change."
          - "Expected Secure Result: Reset tokens are single-use, random, short-lived; Host header injection not possible; old password required for change."
          - "Reference Commands: curl -X POST https://target.com/forgot-password -d 'email=victim@test.com' -H 'Host: attacker.com' | Burp Repeater - reuse reset token after consumption"
        compliance:
          india:
            - "RBI Digital Payment Security Controls (Mandatory 2FA & Credential Hygiene)"
            - "CERT-In CISG-2024-01 (Authentication Hardening)"
            - "DPDP Rules 2025 - Rule 6(1)(b) (Authentication Safeguards)"
