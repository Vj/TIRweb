schema_version: "1.0.0"
tool_suite: "TIRweb"
metadata:
  description: "TIRweb Full OWASP WSTG v4.2 (99 Checks) Ruleset Converted from Book1.xlsx with Indian & Global Regulatory Mappings"
  supported_profiles:
    - "core"
    - "bfsi_fintech"
    - "saas_multitenant"
    - "healthcare_pii"
    - "ecommerce"

modules:
  - module_id: "TIR-IAM"
    name: "Identity, Access Control & Session Engine"
    checks:
      - id: "WEB-IAM-001"
        title: "[WSTG-IDNT-01] Test Role Definitions"
        category: "Identity Management"
        severity: "Medium"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii"]
        test_procedures:
          - "Objective: Verify roles are clearly separated with least privilege."
          - "Enumerate all defined roles."
          - "Map permissions per role."
          - "Test for overlapping/excessive privileges between roles."
          - "Expected Secure Result: Roles enforce least privilege with no unintended overlaps."
          - "Reference Commands: Manual review with test accounts per role via Burp Suite"
        compliance:
          india:
            - "DPDP Rules 2025 - Rule 6(1)(b) (Identity & Least-Privilege Access Control)"
            - "CERT-In CISG-2024-01 (Identity & Provisioning Governance)"
            - "OWASP WSTG v4.2: WSTG-IDNT-01"
          global:
            - "OWASP WSTG v4.2: WSTG-IDNT-01"
            - "OWASP Top 10: A01 Broken Access Control / A07 Auth Failures"
            - "PCI DSS v4.0: Req. 7.2, 8.2"
            - "ISO 27001:2022: A.5.15, A.8.2, A.8.3"
            - "SOC 2: CC6.1, CC6.2"

      - id: "WEB-IAM-002"
        title: "[WSTG-IDNT-02] Test User Registration Process"
        category: "Identity Management"
        severity: "Medium"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Objective: Verify registration validates identity and prevents abuse."
          - "Register with valid/invalid data."
          - "Test duplicate registration."
          - "Test email verification bypass."
          - "Test automated/bulk registration (CAPTCHA)."
          - "Expected Secure Result: Registration validates identity properly; rate-limited; verification cannot be bypassed."
          - "Reference Commands: curl -X POST https://target.com/register -d 'email=test@test.com&pass=Test123!' | Burp Intruder for bulk registration test"
        compliance:
          india:
            - "DPDP Rules 2025 - Rule 6(1)(b) (Identity & Least-Privilege Access Control)"
            - "CERT-In CISG-2024-01 (Identity & Provisioning Governance)"
            - "OWASP WSTG v4.2: WSTG-IDNT-02"
          global:
            - "OWASP WSTG v4.2: WSTG-IDNT-02"
            - "OWASP Top 10: A01 Broken Access Control / A07 Auth Failures"
            - "PCI DSS v4.0: Req. 7.2, 8.2"
            - "ISO 27001:2022: A.5.15, A.8.2, A.8.3"
            - "SOC 2: CC6.1, CC6.2"

      - id: "WEB-IAM-003"
        title: "[WSTG-IDNT-03] Test Account Provisioning Process"
        category: "Identity Management"
        severity: "Medium"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii"]
        test_procedures:
          - "Objective: Verify accounts are provisioned only by authorized parties."
          - "Review who can create accounts (self-service vs admin)."
          - "Test for unauthorized provisioning/privilege assignment during signup."
          - "Expected Secure Result: Only authorized entities can provision accounts/roles."
          - "Reference Commands: Manual review of provisioning workflow; parameter tampering on role field during signup"
        compliance:
          india:
            - "DPDP Rules 2025 - Rule 6(1)(b) (Identity & Least-Privilege Access Control)"
            - "CERT-In CISG-2024-01 (Identity & Provisioning Governance)"
            - "OWASP WSTG v4.2: WSTG-IDNT-03"
          global:
            - "OWASP WSTG v4.2: WSTG-IDNT-03"
            - "OWASP Top 10: A01 Broken Access Control / A07 Auth Failures"
            - "PCI DSS v4.0: Req. 7.2, 8.2"
            - "ISO 27001:2022: A.5.15, A.8.2, A.8.3"
            - "SOC 2: CC6.1, CC6.2"

      - id: "WEB-IAM-004"
        title: "[WSTG-IDNT-04] Test Account Enumeration & Guessable Accounts"
        category: "Identity Management"
        severity: "Medium"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Objective: Determine if usernames/emails can be enumerated via app responses."
          - "Test login/registration/password-reset with valid & invalid usernames."
          - "Compare response messages/timing."
          - "Automate check with wordlist."
          - "Expected Secure Result: Identical responses/timing for valid & invalid accounts; no enumeration possible."
          - "Reference Commands: ffuf -u https://target.com/login -d 'user=FUZZ&pass=x' -w usernames.txt -fc 200 | Burp Intruder comparing response length/timing"
        compliance:
          india:
            - "DPDP Rules 2025 - Rule 6(1)(b) (Identity & Least-Privilege Access Control)"
            - "CERT-In CISG-2024-01 (Identity & Provisioning Governance)"
            - "OWASP WSTG v4.2: WSTG-IDNT-04"
          global:
            - "OWASP WSTG v4.2: WSTG-IDNT-04"
            - "OWASP Top 10: A01 Broken Access Control / A07 Auth Failures"
            - "PCI DSS v4.0: Req. 7.2, 8.2"
            - "ISO 27001:2022: A.5.15, A.8.2, A.8.3"
            - "SOC 2: CC6.1, CC6.2"

      - id: "WEB-IAM-005"
        title: "[WSTG-IDNT-05] Test Weak/Unenforced Username Policy"
        category: "Identity Management"
        severity: "Low"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Objective: Check if usernames follow predictable patterns (e.g. sequential IDs, emails as usernames)."
          - "Review username generation logic."
          - "Test predictability of usernames/IDs."
          - "Expected Secure Result: Usernames are not predictable/sequential; no PII exposed as username."
          - "Reference Commands: Manual review; sequential ID testing via Burp Repeater"
        compliance:
          india:
            - "DPDP Rules 2025 - Rule 6(1)(b) (Identity & Least-Privilege Access Control)"
            - "CERT-In CISG-2024-01 (Identity & Provisioning Governance)"
            - "OWASP WSTG v4.2: WSTG-IDNT-05"
          global:
            - "OWASP WSTG v4.2: WSTG-IDNT-05"
            - "OWASP Top 10: A01 Broken Access Control / A07 Auth Failures"
            - "PCI DSS v4.0: Req. 7.2, 8.2"
            - "ISO 27001:2022: A.5.15, A.8.2, A.8.3"
            - "SOC 2: CC6.1, CC6.2"

      - id: "WEB-IAM-006"
        title: "[WSTG-IDNT-06] Test Permissions of Guest/Unauthenticated Users"
        category: "Identity Management"
        severity: "High"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Objective: Verify unauthenticated users cannot access restricted functionality."
          - "Access authenticated-only endpoints without a session/token."
          - "Attempt direct object access."
          - "Expected Secure Result: All protected resources return 401/403 for unauthenticated requests."
          - "Reference Commands: curl https://target.com/api/user/profile (no auth header) | curl https://target.com/admin/dashboard"
        compliance:
          india:
            - "DPDP Rules 2025 - Rule 6(1)(b) (Identity & Least-Privilege Access Control)"
            - "CERT-In CISG-2024-01 (Identity & Provisioning Governance)"
            - "OWASP WSTG v4.2: WSTG-IDNT-06"
          global:
            - "OWASP WSTG v4.2: WSTG-IDNT-06"
            - "OWASP Top 10: A01 Broken Access Control / A07 Auth Failures"
            - "PCI DSS v4.0: Req. 7.2, 8.2"
            - "ISO 27001:2022: A.5.15, A.8.2, A.8.3"
            - "SOC 2: CC6.1, CC6.2"

      - id: "WEB-IAM-007"
        title: "[WSTG-ATHN-01] Test Credentials Transported over Encrypted Channel"
        category: "Authentication Testing"
        severity: "Critical"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Objective: Ensure credentials are never sent over unencrypted channels."
          - "Intercept login traffic with proxy."
          - "Verify HTTPS enforced for all auth traffic."
          - "Check for HTTP fallback/mixed content."
          - "Expected Secure Result: All credential submissions occur exclusively over TLS; no HTTP fallback."
          - "Reference Commands: Burp Suite proxy intercept on login | curl -I http://target.com/login (check redirect to https)"
        compliance:
          india:
            - "RBI Digital Payment Security Controls (Mandatory 2FA & Credential Hygiene)"
            - "CERT-In CISG-2024-01 (Authentication Hardening)"
            - "DPDP Rules 2025 - Rule 6(1)(b) (Authentication Safeguards)"
            - "OWASP WSTG v4.2: WSTG-ATHN-01"
          global:
            - "OWASP WSTG v4.2: WSTG-ATHN-01"
            - "OWASP Top 10: A07 Identification and Authentication Failures"
            - "PCI DSS v4.0: Req. 8.3, 8.4"
            - "ISO 27001:2022: A.8.5"
            - "SOC 2: CC6.1"

      - id: "WEB-IAM-008"
        title: "[WSTG-ATHN-02] Test Default Credentials"
        category: "Authentication Testing"
        severity: "Critical"
        execution_mode: "hybrid"
        tool_binding: ["nuclei_auth"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Objective: Check for default/vendor-supplied credentials still active."
          - "Identify platform/CMS/device in use."
          - "Attempt known default credential pairs."
          - "Document any successful login."
          - "Expected Secure Result: No default credentials are active on any account."
          - "Reference Commands: hydra -L defaults_users.txt -P defaults_pass.txt target.com http-post-form | Manual test: admin/admin, admin/password"
        compliance:
          india:
            - "RBI Digital Payment Security Controls (Mandatory 2FA & Credential Hygiene)"
            - "CERT-In CISG-2024-01 (Authentication Hardening)"
            - "DPDP Rules 2025 - Rule 6(1)(b) (Authentication Safeguards)"
            - "OWASP WSTG v4.2: WSTG-ATHN-02"
          global:
            - "OWASP WSTG v4.2: WSTG-ATHN-02"
            - "OWASP Top 10: A07 Identification and Authentication Failures"
            - "PCI DSS v4.0: Req. 8.3, 8.4"
            - "ISO 27001:2022: A.8.5"
            - "SOC 2: CC6.1"

      - id: "WEB-IAM-009"
        title: "[WSTG-ATHN-03] Test Weak Lock Out Mechanism"
        category: "Authentication Testing"
        severity: "High"
        execution_mode: "hybrid"
        tool_binding: ["nuclei_auth"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Objective: Verify account lockout/rate limiting exists after failed attempts."
          - "Attempt multiple failed logins for a valid user."
          - "Observe lockout threshold/duration."
          - "Test lockout bypass (X-Forwarded-For, different IP)."
          - "Expected Secure Result: Account locks/rate-limits after N failed attempts; lockout cannot be trivially bypassed."
          - "Reference Commands: hydra -l victim@test.com -P rockyou.txt target.com http-post-form '/login:user=^USER^&pass=^PASS^:F=incorrect' | Burp Intruder with header spoofing"
        compliance:
          india:
            - "RBI Digital Payment Security Controls (Mandatory 2FA & Credential Hygiene)"
            - "CERT-In CISG-2024-01 (Authentication Hardening)"
            - "DPDP Rules 2025 - Rule 6(1)(b) (Authentication Safeguards)"
            - "OWASP WSTG v4.2: WSTG-ATHN-03"
          global:
            - "OWASP WSTG v4.2: WSTG-ATHN-03"
            - "OWASP Top 10: A07 Identification and Authentication Failures"
            - "PCI DSS v4.0: Req. 8.3, 8.4"
            - "ISO 27001:2022: A.8.5"
            - "SOC 2: CC6.1"

      - id: "WEB-IAM-010"
        title: "[WSTG-ATHN-04] Test for Bypassing Authentication Schema"
        category: "Authentication Testing"
        severity: "Critical"
        execution_mode: "hybrid"
        tool_binding: ["nuclei_auth"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Objective: Attempt to bypass login via parameter tampering, forced browsing, SQLi."
          - "Try forced browsing to authenticated pages."
          - "Try SQL injection in login fields."
          - "Test parameter manipulation (e.g. isAdmin=true)."
          - "Test session prediction."
          - "Expected Secure Result: Authentication cannot be bypassed via any tested technique."
          - "Reference Commands: ' OR '1'='1'-- - (in username field) | curl https://target.com/dashboard (no session) | Burp Repeater param tampering"
        compliance:
          india:
            - "RBI Digital Payment Security Controls (Mandatory 2FA & Credential Hygiene)"
            - "CERT-In CISG-2024-01 (Authentication Hardening)"
            - "DPDP Rules 2025 - Rule 6(1)(b) (Authentication Safeguards)"
            - "OWASP WSTG v4.2: WSTG-ATHN-04"
          global:
            - "OWASP WSTG v4.2: WSTG-ATHN-04"
            - "OWASP Top 10: A07 Identification and Authentication Failures"
            - "PCI DSS v4.0: Req. 8.3, 8.4"
            - "ISO 27001:2022: A.8.5"
            - "SOC 2: CC6.1"

      - id: "WEB-IAM-011"
        title: "[WSTG-ATHN-05] Test Remember Password Functionality"
        category: "Authentication Testing"
        severity: "Medium"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Objective: Verify 'remember me' doesn't store credentials insecurely."
          - "Enable remember-me and inspect cookies/local storage."
          - "Check token expiry and storage format (plaintext vs hashed)."
          - "Expected Secure Result: Remember-me token is random, non-guessable, and expires appropriately; no plaintext creds stored."
          - "Reference Commands: Browser DevTools > Application > Cookies/Storage | Burp Suite - inspect Set-Cookie header"
        compliance:
          india:
            - "RBI Digital Payment Security Controls (Mandatory 2FA & Credential Hygiene)"
            - "CERT-In CISG-2024-01 (Authentication Hardening)"
            - "DPDP Rules 2025 - Rule 6(1)(b) (Authentication Safeguards)"
            - "OWASP WSTG v4.2: WSTG-ATHN-05"
          global:
            - "OWASP WSTG v4.2: WSTG-ATHN-05"
            - "OWASP Top 10: A07 Identification and Authentication Failures"
            - "PCI DSS v4.0: Req. 8.3, 8.4"
            - "ISO 27001:2022: A.8.5"
            - "SOC 2: CC6.1"

      - id: "WEB-IAM-012"
        title: "[WSTG-ATHN-06] Test Browser Cache Weaknesses"
        category: "Authentication Testing"
        severity: "Medium"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Objective: Verify sensitive pages aren't cached by the browser."
          - "Login and browse authenticated pages."
          - "Logout, then use browser back button."
          - "Check Cache-Control/Pragma headers on sensitive pages."
          - "Expected Secure Result: Cache-Control: no-store set on all sensitive/authenticated pages."
          - "Reference Commands: curl -I https://target.com/account -H 'Cookie: session=...' | grep -i cache-control"
        compliance:
          india:
            - "RBI Digital Payment Security Controls (Mandatory 2FA & Credential Hygiene)"
            - "CERT-In CISG-2024-01 (Authentication Hardening)"
            - "DPDP Rules 2025 - Rule 6(1)(b) (Authentication Safeguards)"
            - "OWASP WSTG v4.2: WSTG-ATHN-06"
          global:
            - "OWASP WSTG v4.2: WSTG-ATHN-06"
            - "OWASP Top 10: A07 Identification and Authentication Failures"
            - "PCI DSS v4.0: Req. 8.3, 8.4"
            - "ISO 27001:2022: A.8.5"
            - "SOC 2: CC6.1"

      - id: "WEB-IAM-013"
        title: "[WSTG-ATHN-07] Test Weak Password Policy"
        category: "Authentication Testing"
        severity: "Medium"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Objective: Verify password complexity/length requirements are enforced."
          - "Attempt to set weak passwords (123456, password)."
          - "Test minimum length enforcement."
          - "Check against breached-password list rejection."
          - "Expected Secure Result: Weak/common passwords rejected; policy enforces length/complexity and breach-list check."
          - "Reference Commands: curl -X POST https://target.com/register -d 'password=123456'"
        compliance:
          india:
            - "RBI Digital Payment Security Controls (Mandatory 2FA & Credential Hygiene)"
            - "CERT-In CISG-2024-01 (Authentication Hardening)"
            - "DPDP Rules 2025 - Rule 6(1)(b) (Authentication Safeguards)"
            - "OWASP WSTG v4.2: WSTG-ATHN-07"
          global:
            - "OWASP WSTG v4.2: WSTG-ATHN-07"
            - "OWASP Top 10: A07 Identification and Authentication Failures"
            - "PCI DSS v4.0: Req. 8.3, 8.4"
            - "ISO 27001:2022: A.8.5"
            - "SOC 2: CC6.1"

      - id: "WEB-IAM-014"
        title: "[WSTG-ATHN-08] Test Weak Security Question/Answer"
        category: "Authentication Testing"
        severity: "Low"
        execution_mode: "manual"
        tool_binding: ["manual_proxy"]
        profiles: ["core", "bfsi_fintech", "saas_multitenant", "healthcare_pii", "ecommerce"]
        test_procedures:
          - "Objective: Verify security questions aren't easily guessable/researchable."
          - "Review available security questions."
          - "Assess if answers are publicly discoverable (OSINT)."
          - "Expected Secure Result: Security questions (if used) are not easily OSINT-able; MFA preferred over questions."
          - "Reference Commands: Manual review of security question options"
        compliance:
          india:
            - "RBI Digital Payment Security Controls (Mandatory 2FA & Credential Hygiene)"
            - "CERT-In CISG-2024-01 (Authentication Hardening)"
            - "DPDP Rules 2025 - Rule 6(1)(b) (Authentication Safeguards)"
            - "OWASP WSTG v4.2: WSTG-ATHN-08"
          global:
            - "OWASP WSTG v4.2: WSTG-ATHN-08"
