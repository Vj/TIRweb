name: TIRweb CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  validate-and-test:
    name: Lint, Validate Rules & Run Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libgdk-pixbuf-2.0-0 \
            libffi8 \
            shared-mime-info \
            fonts-liberation

      - name: Install TIRweb & dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Ruff linter
        run: ruff check tirweb tests convert_wstg_excel.py

      - name: Validate YAML Rulesets
        run: |
          tirweb validate --checklist rules/tirweb_checklist_v1.yaml
          tirweb validate --checklist rules/tirweb_wstg_v42_full.yaml

      - name: Run Pytest Suite
        run: pytest -v

  docker-build-smoke:
    name: Build & Smoke-Test Standalone Docker Image
    runs-on: ubuntu-latest
    needs: validate-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TIRweb Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tirweb:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container binaries & CLI
        run: |
          docker run --rm --entrypoint bash tirweb:ci-test -c "\
            tirweb validate --checklist /workspace/rules/tirweb_checklist_v1.yaml && \
            tirweb validate --checklist /workspace/rules/tirweb_wstg_v42_full.yaml && \
            nuclei -version && \
            trivy --version && \
            testssl.sh --version && \
            python -c 'import weasyprint; print(\"WeasyPrint OK:\", weasyprint.__version__)'"
            
  benchmark-precision-recall:
    name: Precision & Recall Regression Benchmark
    runs-on: ubuntu-latest
    needs: validate-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install TIRweb
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Start Benchmark Targets (Juice Shop, DVWA, VAmPI)
        run: |
          docker compose -f benchmarks/docker-compose.benchmark.yml up -d --wait juice-shop dvwa vampi

      - name: Evaluate Precision & Recall Thresholds
        run: |
          python benchmarks/evaluate.py --target-filter "_local" --min-precision 0.90 --min-recall 0.90

      - name: Tear Down Benchmark Containers
        if: always()
        run: |
          docker compose -f benchmarks/docker-compose.benchmark.yml down -v